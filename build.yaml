# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Dongle (central) + OLED status screen
  - board: nice_nano//zmk
    shield: eyelash60_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash60_dongle

  # Peripheral (the keyboard half)
  - board: nice_nano//zmk
    shield: eyelash60_peripheral
    artifact-name: eyelash60_peripheral

  # Settings reset
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
